<style>
:root{
  --page:#000000;            /* page background */
  --green-900:#0E3B2E;
  --green-800:#164A39;
  --green-700:#1F6B4E;
  --green-50:#EEF5F0;
  --gold:#C9A13B;
  --gold-soft:#E9D28F;
  --gold-ink:#8A6414;
  --gold-wash:#F7F0DC;
  --ink:#18231E;
  --muted:#5C6B63;
  --on-green:#BFD3C8;
  --line-on-green:rgba(255,255,255,.13);
  --line:#E2E8E4;
  --white:#FFFFFF;
  --danger:#A12C2C;
  --serif:"Arvo", Rockwell, "Roboto Slab", Georgia, serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--page)}
body{margin:0;background:var(--page);color:var(--white);font-family:var(--sans);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.wrap{max-width:640px;margin:0 auto}

/* ---------- Top: profile, month, summary ---------- */
.top{padding:calc(env(safe-area-inset-top) + 16px) 14px 4px}
.top .profile-row,.top .month-pick{margin-left:4px;margin-right:4px}
.profile-row{display:flex;align-items:center;gap:12px}
.profile{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;min-width:0;flex:1;color:var(--white)}
.avatar-wrap{position:relative;flex:none}
.avatar{width:58px;height:58px;border-radius:50%;flex:none;border:2px solid var(--gold);background:var(--green-800);display:grid;place-items:center;overflow:hidden;font-family:var(--serif);font-weight:700;font-size:22px;color:var(--gold-soft)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:1px;right:1px;width:15px;height:15px;border-radius:50%;background:var(--gold);border:2.5px solid var(--page)}
.badge[hidden]{display:none}
.pname{display:block;font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.puser{display:block;font-size:13px;color:var(--on-green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* saving runs quietly; the message only appears if a save fails */
.save{display:none;font-size:12px;color:var(--on-green);align-items:center;gap:6px;flex:none}
.save::before{content:"";width:8px;height:8px;border-radius:50%;background:#5FBF8A}
.save.pending::before{background:var(--gold)}
.save.fail{display:flex;color:#FFD2D2;font-weight:600}
.save.fail::before{background:#FF6B6B}

.month-pick{position:relative;display:inline-flex;align-items:center;margin:18px 4px 14px}
.month-pick select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--white);font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.1;padding:0 28px 0 0;cursor:pointer}
.month-pick select option{color:var(--ink);font-family:var(--sans);font-size:16px}
.month-pick::after{content:"";position:absolute;right:5px;top:50%;width:9px;height:9px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:translateY(-70%) rotate(45deg);pointer-events:none}

.summary-card{padding:14px 14px 14px 16px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.summary div{min-width:0}
.summary dt{font-size:12.5px;color:var(--on-green)}
.summary dd{margin:2px 0 0;font-size:clamp(17px,5vw,24px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .diff dd{color:var(--gold-soft)}
.summary-note{margin:8px 0 0;font-size:12.5px;color:var(--on-green)}

/* ---------- Background market chart ---------- */
/* World map: always on, very faint, a paler gold than the candles, Africa in the centre */
#bgMap{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bgMap svg{flex:none;width:100vw;height:auto}
@media (max-aspect-ratio:1/1){#bgMap svg{width:150vw}}
#bgMap path{fill:#EDCB72;fill-opacity:.08}
#bgChart{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#bgChart[hidden]{display:none}
.top,main,footer{position:relative;z-index:1}

/* ---------- Raised panels: lighter green on the darker page, gold edge ---------- */
.panel{background:rgba(40,137,105,.60);border-left:4px solid var(--gold);border-radius:14px;
  box-shadow:0 12px 26px rgba(0,0,0,.38), 0 2px 4px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.07);}

/* ---------- Lists ---------- */
main{padding:6px 14px 20px}
main.wrap{max-width:668px}   /* same content width as the header on wide screens */
.divider{display:flex;align-items:center;gap:12px;margin:34px 4px 0;color:var(--gold-soft);font-size:13px;font-weight:600}
.divider::after{content:"";flex:1;height:1px;background:rgba(233,210,143,.4)}

.sec{margin-top:22px;padding:16px 14px 6px 16px}
/* Income has its own green; the four money-out sections share another */
.sec[data-sec=income]{background:rgba(57,177,128,.60)}
.sec:not([data-sec=income]){background:rgba(33,118,95,.60)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid rgba(233,210,143,.45)}
.sec-head h2{margin:0;font-family:var(--serif);font-weight:700;font-size:23px;color:var(--white);line-height:1.2}
.sec-left{font-weight:700;font-size:15px;white-space:nowrap}

.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 46px;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid var(--line-on-green);transition:background-color .2s ease}
.list .row:last-child{border-bottom-color:transparent}
.row-open{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;color:var(--white);text-align:left;padding:10px 6px;min-width:0;border-radius:8px}
.row-open:hover .nm{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.row-open .who{min-width:0}
.row-open .nm{display:block;font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.row-open .tag{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--gold-soft);background:rgba(201,161,59,.18);border-radius:4px;padding:1px 6px}
.row-open .when{display:block;margin-top:2px;font-size:12.5px;font-weight:600;color:var(--gold-soft)}
.row-open .amt{font-weight:700;font-size:16.5px;white-space:nowrap;letter-spacing:.01em}
/* ticked lines turn light gold, the same in every section */
.row.is-done{background:#E8D49A;box-shadow:0 2px 6px rgba(0,0,0,.18);border-bottom-color:transparent;margin:3px 0;border-radius:10px}
.row.is-done .row-open{color:var(--green-900)}
.row.is-done .when{color:#6E5412}
.row.is-done .tag{color:#6E5412;background:rgba(110,84,18,.12)}
/* grip to drag a line up or down within its heading */
.grip{width:28px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0;margin-left:-4px;color:rgba(233,210,143,.7);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:6px}
.grip svg{width:12px;height:20px;fill:currentColor;pointer-events:none}
.grip:hover{color:var(--gold-soft)}
.row.is-done .grip{color:rgba(14,59,46,.5)}
.row.dragging{position:relative;z-index:6;background:#103F31;box-shadow:0 12px 26px rgba(0,0,0,.55), inset 0 0 0 1.5px var(--gold);border-radius:10px;transition:none}
.row.dragging.is-done{background:#E8D49A}
.row.dragging .grip{cursor:grabbing;color:var(--gold-soft)}
.list.sorting .row:not(.dragging){transition:transform .16s ease}
body.drag-active{-webkit-user-select:none;user-select:none;cursor:grabbing}
.tick{width:42px;height:42px;border-radius:9px;border:2px solid rgba(255,255,255,.55);background:transparent;display:grid;place-items:center;justify-self:end;padding:0}
.tick svg{width:24px;height:24px;stroke:var(--gold-soft);stroke-width:3;fill:none;opacity:0;transition:opacity .15s}
.tick:hover svg{opacity:.4}
.row.is-done .tick{background:var(--green-900);border-color:var(--green-900);margin-right:6px}
.row.is-done .tick svg{stroke:var(--gold-soft);opacity:1}

.alldone{display:flex;align-items:center;gap:10px;padding:12px;margin-top:8px;background:rgba(201,161,59,.16);border-radius:10px;color:var(--gold-soft);font-weight:600}
.alldone svg{width:22px;height:22px;flex:none;stroke:var(--green-900);stroke-width:3;fill:none;background:var(--gold);border-radius:50%;padding:4px}
.empty{padding:12px 0;color:var(--on-green);font-size:14px}

.add{margin-top:4px;border:0;background:none;color:var(--gold-soft);font-weight:600;font-size:15px;padding:10px 0}
.add:hover{text-decoration:underline;text-underline-offset:3px}

.next{margin:36px 0 0;padding:18px;text-align:center}
.next p{margin:0 0 12px;color:var(--on-green);font-size:14px}
.next .b{width:100%;padding:13px;background:var(--gold);border-color:var(--gold);color:var(--green-900)}
.tiny{display:flex;justify-content:center;gap:18px;margin-top:22px}
.tiny button{border:0;background:none;color:var(--on-green);font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
footer{padding:0 16px calc(env(safe-area-inset-bottom) + 28px);font-size:12px;color:var(--on-green);text-align:center}

/* ---------- Sign-in screen ---------- */
body.locked .top,body.locked main,body.locked footer{display:none}
.lock{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px)}
.lock[hidden]{display:none}
.lock-card{width:min(400px,100%);padding:26px 22px 20px 24px;text-align:center}
.lock-logo{width:76px;height:76px;border-radius:18px;display:block;margin:0 auto 14px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.lock-title{margin:0;font-family:var(--serif);font-weight:700;font-size:26px}
.lock-sub{margin:6px 0 18px;color:var(--on-green);font-size:14.5px}
.lock form{display:flex;flex-direction:column;gap:12px;text-align:left}
.lock label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--on-green)}
.lock label[hidden]{display:none}
.lock input[type=text],.lock input[type=password]{border:1px solid rgba(255,255,255,.32);border-radius:9px;background:rgba(0,0,0,.25);color:var(--white);padding:11px 12px;font-size:16px;width:100%}
.lock input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,161,59,.35)}
.lock .code{letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.lock .stay{flex-direction:row;align-items:center;gap:10px;font-weight:500;color:var(--white);font-size:14.5px}
.lock .stay input{width:20px;height:20px;accent-color:var(--gold);margin:0}
.lock-err{margin:0;min-height:1.2em;color:#FFC9C9;font-size:13.5px;font-weight:600}
.lock .lock-go{width:100%;padding:13px;background:var(--gold);border-color:var(--gold);color:var(--green-900);font-size:16px}
.lock .lock-go:disabled{opacity:.7}
.lock-link{margin-top:12px;border:0;background:none;color:var(--gold-soft);font-weight:600;font-size:14.5px;padding:8px}
.lock-link[hidden]{display:none}
.lock-note{margin:14px 0 0;font-size:12.5px;color:var(--on-green)}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.acct p{margin:0;font-size:14.5px}
.acct .btns{display:flex;gap:8px}

/* ---------- Dialogs ---------- */
dialog{border:0;border-radius:14px;padding:0;width:min(440px,94vw);max-height:90vh;color:var(--ink);background:var(--white);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-head{background:var(--green-900);color:var(--white);padding:14px 18px;border-bottom:3px solid var(--gold)}
.dlg-head h3{margin:0;font-family:var(--serif);font-weight:700;font-size:20px}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dlg-body p{margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field > span,.group-label{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=password]{border:1px solid #CBD5CF;border-radius:8px;padding:10px;font-size:16px;background:var(--white);color:var(--ink);width:100%}
.move-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.move-row[hidden]{display:none}
.move-row > span{font-size:13px;font-weight:600;color:var(--muted);margin-right:auto}
.move-row .b:disabled{opacity:.4}
.choice{display:flex;flex-direction:column;gap:6px;border:0;margin:0;padding:0}
.choice legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:5px}
.choice label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.choice label:has(input:checked){border-color:var(--green-700);background:var(--green-50)}
.choice input{accent-color:var(--green-700);width:18px;height:18px;margin:0}
.choice small{display:block;color:var(--muted);font-size:12.5px}
.photo-edit{display:flex;align-items:center;gap:14px}
.photo-edit .avatar{width:72px;height:72px;font-size:26px;background:var(--green-900)}
.photo-edit div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--green-900);cursor:pointer}
.seg label:has(input:checked){border-color:var(--green-700);background:var(--green-50)}
.seg input{accent-color:var(--green-700);margin:0}
.data-group{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}

const monthKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');

const monthShort = k => monthLabel(k).split(' ')[0];
const nextMonthKey = k => { const [y, m] = k.split('-').map(Number); return monthKey(new Date(y, m, 1)); };
const ymd = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } }

/* ================= State ================= */
function emptyMonth(){ const s = {}; SECTIONS.forEach(x => s[x.id] = []); return {sections: s}; }
function seedMonth(){
  const m = emptyMonth();
  SECTIONS.forEach(s => m.sections[s.id] = ((SEED && SEED[s.id]) || []).map(([name, amount]) => ({id: uid(), name, amount, oneOff: false, done: false})));
  return m;
}
function freshState(profile){
  const k = monthKey(new Date());
  return {profile: profile || {name:'', username:'', photo:''}, currentMonth:k, months:{[k]: seedMonth()}};
}
function normalize(d){
  const p = d.profile || {};
  const st = {profile:{
    name: String(p.name || ''), username: String(p.username || ''),
    photo: typeof p.photo === 'string' && p.photo.startsWith('data:image/') ? p.photo : ''
  }, currentMonth:'', months:{}};
  const months = d.months && typeof d.months === 'object' ? d.months : {};
  Object.keys(months).forEach(k => {
    if (!/^\d{4}-\d{2}$/.test(k)) return;
    const src = months[k] || {}, m = emptyMonth();
    SECTIONS.forEach(s => {
      const arr = src.sections && Array.isArray(src.sections[s.id]) ? src.sections[s.id] : [];
      m.sections[s.id] = arr.map(it => {
        const o = {id:String(it.id || uid()), name:String(it.name || 'Item'), amount:round2(it.amount), oneOff:!!it.oneOff, done:!!it.done};
        if (o.done) o.doneAt = String(it.doneAt || new Date().toISOString());
        return o;
      });
    });
    st.months[k] = m;
  });
  const keys = Object.keys(st.months).sort();
  if (!keys.length) { const k = monthKey(new Date()); st.months[k] = emptyMonth(); keys.push(k); }
  st.currentMonth = st.months[d.currentMonth] ? d.currentMonth : keys[keys.length - 1];
  return st;
}
let loadProblem = false;
function load(){
  const raw = lsGet(STORE_KEY);
  if (!raw) return freshState();
  try { return normalize(JSON.parse(raw)); }
  catch(e){
    // keep the damaged copy so nothing is lost, then start from the spreadsheet figures
    lsSet(STORE_KEY + '.damaged-' + Date.now(), raw);
    loadProblem = true;
    return freshState();
  }
}

let state = null;      // loaded after sign-in
const cur = () => state.months[state.currentMonth];

/* ================= Saving ================= */
let saveTimer = null, pending = false;
function save(now){ pending = true; setSaveState('pending'); clearTimeout(saveTimer); if (now) doSave(1); else saveTimer = setTimeout(() => doSave(1), 350); }
function doSave(attempt){
  clearTimeout(saveTimer);
  const str = JSON.stringify(state);
  const ok = lsSet(STORE_KEY, str) && lsGet(STORE_KEY) === str;
  if (ok) { pending = false; setSaveState('ok'); return; }
  if (attempt < 3) { setTimeout(() => doSave(attempt + 1), 300); return; }
  setSaveState('fail');
}
function setSaveState(s){
  const el = $('saveState'); el.classList.remove('fail', 'pending');
  if (s === 'ok') el.textContent = 'Saved ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  else if (s === 'pending') { el.classList.add('pending'); el.textContent = 'Saving…'; }
  else { el.classList.add('fail'); el.textContent = 'Not saved. Open profile and back up'; }
}
function flush(){ if (pending) doSave(1); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);

/* ================= Totals ================= */
function totals(m){
  const t = {};
  SECTIONS.forEach(s => {
    const items = m.sections[s.id];
    const all = items.reduce((a, it) => a + it.amount, 0);
    const done = items.filter(it => it.done).reduce((a, it) => a + it.amount, 0);
    t[s.id] = {all, done, left: all - done, count: items.length, doneCount: items.filter(it => it.done).length};
  });
  const out = ['debit', 'invest', 'bonds', 'cc'].reduce((a, id) => ({all:a.all + t[id].all, done:a.done + t[id].done}), {all:0, done:0});
  return {sec:t, inAll:t.income.all, inDone:t.income.done, outAll:out.all, outDone:out.done};
}

/* ================= Render ================= */
function initials(name){ const p = name.trim().split(/\s+/).filter(Boolean); return p.length ? (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase() : '?'; }
function paintAvatar(el, prof){ el.innerHTML = prof.photo ? `<img src="${esc(prof.photo)}" alt="">` : esc(initials(prof.name)); }

function renderAll(){ renderProfile(); renderMonthSel(); renderLists(); renderSummary(); renderBackupAge(); }

function renderProfile(){
  const p = state.profile;
  paintAvatar($('avatar'), p);
  $('pName').textContent = p.name || 'Add your name';
  $('pUser').textContent = authUser() ? '@' + authUser() : '';
}
function renderMonthSel(){
  $('monthSel').innerHTML = Object.keys(state.months).sort().reverse()
    .map(k => `<option value="${k}"${k === state.currentMonth ? ' selected' : ''}>${esc(monthLabel(k))}</option>`).join('');
}

function rowHTML(it, s){
  const tag = it.oneOff ? '<span class="tag">This month only</span>' : '';
  const when = it.done ? `<span class="when">${s.dir === 'in' ? 'In' : 'Off'} ${esc(fmtDay(it.doneAt))}</span>` : '';
  const verb = s.dir === 'in' ? 'is in' : 'has come off';
  return `<li class="row${it.done ? ' is-done' : ''}" data-id="${esc(it.id)}">
    <button type="button" class="grip" data-grip title="Drag to move" aria-label="Move ${esc(it.name)}. Drag, or use the up and down arrow keys">${GRIP}</button>
    <button type="button" class="row-open" data-act="edit" aria-label="${esc(it.name)}, ${esc(fmt(it.amount))}. Open to edit">
      <span class="who"><span class="nm">${esc(it.name)}</span>${tag}${when}</span>
      <span class="amt">${fmt(it.amount)}</span>
    </button>
    <button type="button" class="tick" data-act="tick" role="checkbox" aria-checked="${it.done}" aria-label="${esc(it.name)} ${verb}">${CHECK}</button>
  </li>`;
}
function renderLists(){
  const m = cur();
  let html = '';
  SECTIONS.forEach(s => {
    if (s.id === 'debit') html += '<div class="divider">Money out</div>';
    const items = m.sections[s.id];
    const allTicked = items.length && items.every(it => it.done);
    const body = items.length
      ? `<ul class="list">${items.map(it => rowHTML(it, s)).join('')}</ul>`
      : `<ul class="list"><li class="empty">Nothing under ${esc(s.title)} yet.</li></ul>`;
    html += `<section class="sec panel" data-sec="${s.id}" aria-labelledby="h-${s.id}">
      <div class="sec-head"><h2 id="h-${s.id}">${esc(s.title)}</h2><span class="sec-left" id="left-${s.id}"></span></div>
      ${body}
      ${allTicked ? `<div class="alldone">${CHECK}<span>${esc(s.allDone)}</span></div>` : ''}
      <button type="button" class="add" data-act="add" data-sec="${s.id}">+ ${esc(s.add)}</button>
    </section>`;
  });
  $('lists').innerHTML = html;

  const last = Object.keys(state.months).sort().pop();
  const isLatest = state.currentMonth === last;
  $('nextBox').hidden = !isLatest;
  if (isLatest) {
    const nk = nextMonthKey(last);
    const leftCount = SECTIONS.reduce((a, s) => a + m.sections[s.id].filter(it => !it.done).length, 0);
    $('nextNote').textContent = leftCount
      ? `${leftCount} still to tick in ${monthShort(state.currentMonth)}. When you start ${monthShort(nk)}, everything comes back unticked.`
      : `Everything for ${monthShort(state.currentMonth)} is ticked off. Start ${monthShort(nk)} to bring it all back.`;
    $('nextBtn').textContent = 'Start ' + monthLabel(nk);
  }
}

function renderSummary(){
  const m = cur(), t = totals(m);
  $('sIn').textContent = fmt(t.inDone);
  $('sOut').textContent = fmt(t.outDone);
  $('sDiff').textContent = fmt(t.inDone - t.outDone);
  $('sNote').textContent = `Still to come in ${fmt(t.inAll - t.inDone)}. Still to come off ${fmt(t.outAll - t.outDone)}. Once everything is ticked the difference will be ${fmt(t.inAll - t.outAll)}.`;
  SECTIONS.forEach(s => {
    const x = t.sec[s.id], l = $('left-' + s.id);
    if (!l) return;
    l.textContent = fmt(x.left);   // what's still to come; goes down as lines are ticked
  });
}

function renderBackupAge(){
  const iso = lsGet(BACKUP_KEY);
  let txt = 'No backup downloaded yet', stale = true;
  if (iso && !isNaN(Date.parse(iso))) {
    const days = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 864e5));
    txt = days <= 0 ? 'Last backup today' : days === 1 ? 'Last backup yesterday' : `Last backup ${days} days ago`;
    stale = days >= 7;
  }
  $('backupAge').textContent = txt;
  $('backupBtn').classList.toggle('nudge', stale);
  $('backupBadge').hidden = !stale;
}

/* ================= Toast & confirm ================= */
let toastTimer;
function toast(msg, action){
  $('toastMsg').textContent = msg;
  const b = $('toastAct');
  if (action) { b.hidden = false; b.textContent = action.label; b.onclick = () => { hideToast(); action.fn(); }; }
  else { b.hidden = true; b.onclick = null; }
  $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, action ? 5000 : Math.max(3000, msg.length * 55));
}
function hideToast(){ $('toast').classList.remove('show'); }
function confirmBox({title, body, ok = 'OK', danger = false}){
  return new Promise(resolve => {
    const d = $('confirmDlg');
    $('confirmTitle').textContent = title; $('confirmBody').textContent = body;
    const yes = $('confirmYes'), no = $('confirmNo');
    yes.textContent = ok; yes.className = 'b ' + (danger ? 'b-danger-fill' : 'b-primary');
    const done = v => { yes.onclick = no.onclick = null; d.onclose = null; if (d.open) d.close(); resolve(v); };
    yes.onclick = () => done(true); no.onclick = () => done(false); d.onclose = () => done(false);
    d.showModal();
  });
}

/* ================= Items ================= */
function findItem(id){
  const m = cur();
  for (const s of SECTIONS) { const i = m.sections[s.id].findIndex(it => it.id === id); if (i > -1) return {sec:s.id, index:i, item:m.sections[s.id][i]}; }
  return null;
}
function setDone(id, done){
  const f = findItem(id); if (!f) return;
  f.item.done = done;
  if (done) f.item.doneAt = new Date().toISOString(); else delete f.item.doneAt;
  save(true); renderLists(); renderSummary();
}

const lists = $('lists');
lists.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'add') return openItem(null, btn.dataset.sec);
  const row = btn.closest('.row'); if (!row) return;
  const id = row.dataset.id;
  if (act === 'edit') return openItem(id);
  if (act === 'tick') {
    const f = findItem(id); if (!f) return;
    setDone(id, !f.item.done);
    const t = document.querySelector(`.row[data-id="${CSS.escape(id)}"] .tick`);
    if (t) t.focus({preventScroll: true});
  }
});

/* ---- Add / edit dialog ---- */
let editing = null;
function openItem(id, secId){
  const f = id ? findItem(id) : null;
  editing = f ? {id, sec:f.sec} : {id:null, sec:secId};
  const s = SEC[editing.sec];
  $('itemTitle').textContent = f ? 'Edit ' + f.item.name : s.add;
  $('fName').value = f ? f.item.name : '';
  $('fName').placeholder = s.dir === 'in' ? 'e.g. Charter tips' : 'e.g. Netflix';
  $('fAmount').value = f && f.item.amount ? String(f.item.amount) : '';
  const once = f ? f.item.oneOff : false;
  document.querySelector(`input[name=repeat][value=${once ? 'once' : 'every'}]`).checked = true;
  $('deleteItemBtn').hidden = !f;
  $('moveWrap').hidden = !f;
  syncMoveButtons();
  $('itemSave').textContent = f ? 'Save' : 'Add';
  $('itemDlg').showModal();
  if (!f) $('fName').focus();
  else { const am = $('fAmount'); am.focus(); try { am.select(); } catch(_){} }
}
$('itemCancel').addEventListener('click', () => $('itemDlg').close());
function syncMoveButtons(){
  const f = editing && editing.id ? findItem(editing.id) : null;
  $('moveUp').disabled = !f || f.index === 0;
  $('moveDown').disabled = !f || f.index === cur().sections[f.sec].length - 1;
}
function moveFromDialog(step){
  const f = findItem(editing.id); if (!f) return;
  moveItemTo(f.sec, f.index, f.index + step);   // the list behind updates straight away
  syncMoveButtons();
}
$('moveUp').addEventListener('click', () => moveFromDialog(-1));
$('moveDown').addEventListener('click', () => moveFromDialog(1));
$('itemForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('fName').value.trim();
  if (!name) { $('fName').focus(); toast('Give it a name first.'); return; }
  const data = {name, amount: parseAmount($('fAmount').value), oneOff: document.querySelector('input[name=repeat]:checked').value === 'once'};
  if (editing.id) { const f = findItem(editing.id); if (f) Object.assign(f.item, data); toast('Saved ' + name); }
  else { cur().sections[editing.sec].push(Object.assign({id: uid(), done: false}, data)); toast(`Added ${name} to ${SEC[editing.sec].title}`); }
  save(true); $('itemDlg').close(); renderLists(); renderSummary();
});
$('deleteItemBtn').addEventListener('click', async () => {
  const f = findItem(editing.id); if (!f) return;
  $('itemDlg').close();
  const ok = await confirmBox({title:`Delete ${f.item.name}?`, body:`It's removed from ${monthLabel(state.currentMonth)} and won't come back in future months. Earlier months keep their record.`, ok:'Delete', danger:true});
  if (!ok) return;
  const g = findItem(f.item.id); if (!g) return;
  cur().sections[g.sec].splice(g.index, 1);
  save(true); renderLists(); renderSummary(); toast('Deleted ' + f.item.name);
});

/* ================= Drag to reorder =================
   Press the grip on the left of a line and drag it up or down within its heading.
   Works with a finger or a mouse (pointer events); the page scrolls when you drag
   near the top or bottom of the screen. The other lines slide out of the way while
   you drag, and the new order is saved when you let go. Arrow keys on the grip, or
   Move up / Move down in the edit window, do the same without dragging. */
function moveItemTo(secId, from, to){
  const arr = cur().sections[secId];
  if (from === to || to < 0 || to >= arr.length) return false;
  const [it] = arr.splice(from, 1); arr.splice(to, 0, it);
  save(true); renderLists(); renderSummary();
  return true;
}
let drag = null;
lists.addEventListener('pointerdown', e => {
  const grip = e.target.closest('[data-grip]'); if (!grip || drag) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const li = grip.closest('.row'), ul = li.parentElement, rows = [...ul.querySelectorAll('.row')];
  const sy = window.scrollY, boxes = rows.map(r => r.getBoundingClientRect());
  const idx = rows.indexOf(li), cs = getComputedStyle(li);
  drag = {
    li, ul, rows, idx, target: idx, pid: e.pointerId, grip,
    sec: li.closest('section').dataset.sec,
    mids: boxes.map(b => b.top + sy + b.height / 2),             // page positions, so scrolling while dragging works
    startY: e.clientY + sy, y: e.clientY,
    slot: boxes[idx].height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom),
    lo: boxes[0].top - boxes[idx].top - boxes[idx].height / 2,
    hi: boxes[boxes.length - 1].bottom - boxes[idx].bottom + boxes[idx].height / 2
  };
  try { grip.setPointerCapture(e.pointerId); } catch(_){}
  li.classList.add('dragging'); ul.classList.add('sorting'); document.body.classList.add('drag-active');
  drag.raf = requestAnimationFrame(dragTick);
});
window.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.pid) { drag.y = e.clientY; e.preventDefault(); } }, {passive: false});
window.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pid) endDrag(true); });
window.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) endDrag(false); });
function dragTick(){
  if (!drag) return;
  const edge = 80, vh = window.innerHeight;                        // scroll when near the top or bottom
  if (drag.y < edge) window.scrollBy(0, -Math.ceil((edge - drag.y) / 5));
  else if (drag.y > vh - edge) window.scrollBy(0, Math.ceil((drag.y - (vh - edge)) / 5));
  const d = drag, delta = Math.max(d.lo, Math.min(d.hi, d.y + window.scrollY - d.startY));
  const centre = d.mids[d.idx] + delta;
  let t = d.idx;
  for (let i = 0; i < d.idx; i++) if (centre <= d.mids[i]) { t = i; break; }
  for (let i = d.rows.length - 1; i > d.idx; i--) if (centre >= d.mids[i]) { t = i; break; }
  d.target = t;
  d.li.style.transform = `translateY(${delta}px)`;
  d.rows.forEach((r, i) => {
    if (i === d.idx) return;
    const shift = (d.idx < t && i > d.idx && i <= t) ? -d.slot : (t < d.idx && i >= t && i < d.idx) ? d.slot : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : '';
  });
  d.raf = requestAnimationFrame(dragTick);
}
function endDrag(keep){
  const d = drag; if (!d) return;
  drag = null; cancelAnimationFrame(d.raf);
  try { d.grip.releasePointerCapture(d.pid); } catch(_){}
  document.body.classList.remove('drag-active');
  d.rows.forEach(r => r.style.transform = '');
  d.li.classList.remove('dragging'); d.ul.classList.remove('sorting');
  if (keep && d.target !== d.idx && moveItemTo(d.sec, d.idx, d.target)) focusGrip(cur().sections[d.sec][d.target].id);
}
function focusGrip(id){
  const g = document.querySelector(`.row[data-id="${CSS.escape(id)}"] .grip`);
  if (g) g.focus({preventScroll: true});
}
lists.addEventListener('keydown', e => {
  const grip = e.target.closest && e.target.closest('[data-grip]'); if (!grip) return;
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const f = findItem(grip.closest('.row').dataset.id); if (!f) return;
  if (moveItemTo(f.sec, f.index, f.index + (e.key === 'ArrowUp' ? -1 : 1))) focusGrip(f.item.id);
});

/* ================= Profile ================= */
let photoDraft = '';
function openProfile(){
  const p = state.profile; photoDraft = p.photo;
  $('fPName').value = p.name; $('acctUser').textContent = authUser();
  paintAvatar($('avatarEdit'), {name: p.name, photo: photoDraft});
  $('pdfMonth').textContent = monthLabel(state.currentMonth);
  document.querySelectorAll('input[name=bgMode]').forEach(r => r.checked = r.value === chart.mode);
  renderBackupAge();
  $('profileDlg').showModal();
}
/* Keep any profile edits, close the panel, then run a summary/backup action */
function commitProfile(){
  state.profile = {name: $('fPName').value.trim(), username: authUser(), photo: photoDraft};
  save(true); renderProfile();
}
function fromProfile(fn){ return () => { commitProfile(); $('profileDlg').close(); fn(); }; }
function readPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, S, S);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
$('profileBtn').addEventListener('click', openProfile);
document.querySelectorAll('input[name=bgMode]').forEach(r => r.addEventListener('change', () => { if (r.checked) chart.setMode(r.value); }));
$('choosePhoto').addEventListener('click', () => $('photoInput').click());
$('photoInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
  try { photoDraft = await readPhoto(file); paintAvatar($('avatarEdit'), {name: $('fPName').value, photo: photoDraft}); }
  catch(err){ toast('That photo couldn’t be opened. Try a JPEG or PNG.'); }
});
$('removePhoto').addEventListener('click', () => { photoDraft = ''; paintAvatar($('avatarEdit'), {name: $('fPName').value, photo: ''}); });
$('profileCancel').addEventListener('click', () => $('profileDlg').close());
$('profileForm').addEventListener('submit', e => {
  e.preventDefault();
  commitProfile(); $('profileDlg').close(); toast('Profile saved');
});

/* ================= Months ================= */
$('monthSel').addEventListener('change', e => { flush(); state.currentMonth = e.target.value; save(true); renderAll(); });
$('nextBtn').addEventListener('click', async () => {
  flush();
  const last = Object.keys(state.months).sort().pop(), nk = nextMonthKey(last), src = state.months[last];
  const oneOffs = SECTIONS.reduce((a, s) => a + src.sections[s.id].filter(it => it.oneOff).length, 0);
  const ok = await confirmBox({
    title: 'Start ' + monthLabel(nk) + '?',
    body: `Every line comes back unticked with this month's amounts${oneOffs ? `, except ${oneOffs} this-month-only line${oneOffs === 1 ? '' : 's'}` : ''}. ${monthLabel(last)} stays saved, so you can still open it from the month menu and download its PDF.`,
    ok: 'Start ' + monthShort(nk)
  });
  if (!ok) return;
  const m = emptyMonth();
  SECTIONS.forEach(s => m.sections[s.id] = src.sections[s.id].filter(it => !it.oneOff).map(it => ({id: uid(), name: it.name, amount: it.amount, oneOff: false, done: false})));
  state.months[nk] = m; state.currentMonth = nk;
  save(true); renderAll(); window.scrollTo({top: 0}); toast(monthLabel(nk) + ' started');
});
$('deleteMonthBtn').addEventListener('click', async () => {
  if (Object.keys(state.months).length < 2) { toast('This is your only month. Use Start again from spreadsheet instead.'); return; }
  const k = state.currentMonth;
  const ok = await confirmBox({title:'Delete ' + monthLabel(k) + '?', body:'Every line and tick for this month is removed from this browser. Other months stay as they are.', ok:'Delete month', danger:true});
  if (!ok) return;
  delete state.months[k]; state.currentMonth = Object.keys(state.months).sort().pop();
  save(true); renderAll(); toast(monthLabel(k) + ' deleted');
});
$('clearAllBtn').addEventListener('click', async () => {
  const ok = await confirmBox({title:'Start again from spreadsheet?', body:'All months, ticks and changes are wiped and the app goes back to your spreadsheet figures for this month. Your profile stays. Download a backup first if you might need it.', ok:'Start again', danger:true});
  if (!ok) return;
  state = freshState(state.profile); save(true); renderAll(); window.scrollTo({top: 0}); toast('Back to your spreadsheet figures');

/* ================= Backup & restore ================= */

/* ================= Background market chart =================
   Faint stock-market candles (green rising, red falling) that build across the screen from left to right,
   wobbling up and down while trending upwards. When they reach the right-hand side
   they all fade away and a new chart starts. Volume bars run along the bottom.
   The gold world map behind them stays on even when the chart is switched off.
   Not linked to any real market.
   (The older rising-line style is still available from the profile.) */
const BG_KEY = 'debitOrders.bgChart.v2';
const chart = (() => {
  const cv = $('bgChart'), ctx = cv.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const GOLD = '201,161,59';
  const GREEN_C = '38,166,154', RED_C = '239,83,80';   // standard market green and red
  const CANDLE_A = .34, VOL_A = .24;                    // candles, and the volume bars a touch fainter
  let W = 0, H = 0, mode = ['candles', 'line', 'off'].includes(lsGet(BG_KEY)) ? lsGet(BG_KEY) : 'candles', raf = 0, last = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function size(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function grid(){
    ctx.strokeStyle = `rgba(${GOLD},.05)`; ctx.lineWidth = 1; ctx.setLineDash([3, 7]);
    for (let k = 1; k <= 4; k++) { const y = H * (.12 + .18 * k); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.setLineDash([]);
  }

  /* ---- candles: build from left to right, clear, start again ---- */
  const PER = 950, HOLD_C = 2200, FADE_C = 1300, GAP_C = 700;  // ms per candle, then hold, fade out, pause
  let cs = [], cStart = 0, cTotal = 0;
  function seedCandles(){
    const n = W < 600 ? 12 : 20;                              // fewer, bigger candles across the screen
    let raw, tries = 0;
    do {                                                      // keep only charts that clearly end higher than they start
      raw = []; let close = 100;
      for (let i = 0; i < n; i++) {
        const open = close, fall = Math.random() < .40;      // a good share of candles fall (red)
        close = open + (fall ? -rnd(.5, 1.8) : rnd(.6, 2.4)); // rises are bigger: an upward trend
        raw.push({o: open, c: close, h: Math.max(open, close) + rnd(.2, 1), l: Math.min(open, close) - rnd(.2, 1), seed: Math.random() * 6.28});
      }
      const lo0 = Math.min(...raw.map(k => k.l)), hi0 = Math.max(...raw.map(k => k.h));
      const reds = raw.filter(k => k.c < k.o).length;     // always a real mix of red and green
      var upward = (raw[n - 1].c - lo0) / (hi0 - lo0) > .75 && (raw[0].o - lo0) / (hi0 - lo0) < .3 && reds >= 3;
    } while (!upward && ++tries < 40);
    const a = Math.min(...raw.map(k => k.l)), b = Math.max(...raw.map(k => k.h));
    const Y = p => .80 - .68 * (p - a) / (b - a || 1);       // candles use most of the screen; volume sits below
    // trading volume: bigger price moves come with bigger volume, plus some randomness
    const vols = raw.map(k => Math.abs(k.c - k.o) * rnd(.6, 1.2) + rnd(.3, .9)), vmax = Math.max(...vols);
    cs = raw.map((k, i) => ({x: (i + .5) / n, o: Y(k.o), c: Y(k.c), h: Y(k.h), l: Y(k.l), up: k.c >= k.o, seed: k.seed, v: vols[i] / vmax}));
    cTotal = n * PER + HOLD_C + FADE_C + GAP_C;
    cStart = 0;
  }
  function drawCandles(now){
    if (!cStart) cStart = now;
    let t = now - cStart;
    if (t > cTotal) { seedCandles(); cStart = now; t = 0; }
    const n = cs.length, built = cs.length * PER;
    const fade = t < built + HOLD_C ? 1 : Math.max(0, 1 - (t - built - HOLD_C) / FADE_C);
    if (!fade) return;
    const step = W / n, w = Math.max(6, step * .58);
    ctx.lineWidth = 2;
    cs.forEach((k, i) => {
      const life = (t - i * PER) / PER; if (life <= 0) return;   // this candle hasn't started yet
      const g = Math.min(1, life);
      // the candle that is forming wobbles on its way to its closing price
      const wob = g < 1 ? Math.sin(now / 240 + k.seed) * (1 - g) * .012 : 0;
      const c = k.o + (k.c - k.o) * g + wob;
      const up = g < 1 ? c <= k.o : k.up;                     // y runs downwards, so a smaller y is a higher price
      const rgb = up ? GREEN_C : RED_C;
      const col = `rgba(${rgb},${CANDLE_A * fade})`;
      ctx.strokeStyle = col; ctx.fillStyle = col;
      const x = k.x * W;
      const top = Math.min(k.o, c) * H, bot = Math.max(k.o, c) * H;
      const hiY = Math.min(top, (k.o + (k.h - k.o) * g) * H), loY = Math.max(bot, (k.o + (k.l - k.o) * g) * H);
      ctx.beginPath(); ctx.moveTo(x, hiY); ctx.lineTo(x, top); ctx.moveTo(x, bot); ctx.lineTo(x, loY); ctx.stroke();   // wick above and below only
      ctx.fillRect(x - w / 2, top, w, Math.max(2, bot - top));
      // volume bar along the bottom, growing with its candle
      const vh = k.v * H * .13 * g, base = H * .975;
      ctx.fillStyle = `rgba(${rgb},${VOL_A * fade})`;
      ctx.fillRect(x - w / 2, base - vh, w, vh);
    });
  }

  /* ---- rising line (optional style) ---- */
  const DRAW = 12000, HOLD = 4000, FADE = 1800, CYCLE = DRAW + HOLD + FADE;
  let line = [], t0 = 0;
  const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  function makeLine(n){
    const v = [0];
    for (let i = 1; i < n; i++) v.push(v[i - 1] + 1 + rnd(-1.7, 1.7) - (Math.random() < .2 ? rnd(1.2, 2.6) : 0));
    const a = Math.min(...v), b = Math.max(...v);
    return v.map((y, i) => ({x: .05 + .90 * i / (n - 1), y: .80 - .58 * (y - a) / (b - a || 1)}));
  }
  function drawLine(p, al){
    const n = line.length, f = p * (n - 1), k = Math.floor(f), r = f - k;
    const pts = line.slice(0, k + 1).map(q => ({x: q.x * W, y: q.y * H}));
    if (k < n - 1) pts.push({x: (line[k].x + (line[k + 1].x - line[k].x) * r) * W, y: (line[k].y + (line[k + 1].y - line[k].y) * r) * H});
    if (pts.length < 2) return;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(${GOLD},${.24 * al})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.stroke();
    const b = pts[pts.length - 1], s = pts[Math.max(0, pts.length - 4)], ang = Math.atan2(b.y - s.y, b.x - s.x), L = 15;
    ctx.fillStyle = `rgba(${GOLD},${.34 * al})`; ctx.beginPath();
    ctx.moveTo(b.x + Math.cos(ang) * 5, b.y + Math.sin(ang) * 5);
    ctx.lineTo(b.x - Math.cos(ang - .45) * L, b.y - Math.sin(ang - .45) * L);
    ctx.lineTo(b.x - Math.cos(ang + .45) * L, b.y - Math.sin(ang + .45) * L);
    ctx.closePath(); ctx.fill();
  }

  function frame(ts){
    raf = requestAnimationFrame(frame);
    if (ts - last < 33) return;              // about 30 frames a second is plenty for a slow background
    const dt = last ? Math.min(100, ts - last) : 0; last = ts;
    ctx.clearRect(0, 0, W, H); grid();
    if (mode === 'line') {
      if (!t0) t0 = ts;
      let t = ts - t0; if (t > CYCLE) { t0 = ts; t = 0; line = makeLine(W < 600 ? 34 : 54); }
      drawLine(ease(Math.min(1, t / DRAW)), t < DRAW + HOLD ? 1 : Math.max(0, 1 - (t - DRAW - HOLD) / FADE));
    } else drawCandles(ts);
  }
  function start(){
    cancelAnimationFrame(raf); last = 0; t0 = 0;
    cv.hidden = mode === 'off';
    if (mode === 'off') return;
    size(); seedCandles(); line = makeLine(W < 600 ? 34 : 54);
    if (reduce.matches) { ctx.clearRect(0, 0, W, H); grid(); if (mode === 'line') drawLine(1, 1); else { cStart = performance.now() - cs.length * PER; drawCandles(performance.now()); } }
    else raf = requestAnimationFrame(frame);
  }
  window.addEventListener('resize', () => { if (mode === 'off') return; size(); if (reduce.matches) start(); });
  return {
    start,
    setMode(m){ mode = m; lsSet(BG_KEY, m); start(); },
    get mode(){ return mode; }
  };
})();

/* ================= Sign-in =================
   - The spreadsheet figures are stored in this page locked (AES-GCM) with the recovery code,
     so anyone looking at the public GitHub page only sees scrambled text.
   - First time on a device: enter the recovery code (unlocks the figures), then create a username and password.
   - After that: sign in with username and password. Forgot password: the recovery code lets you set a new one.
   - The password itself is never stored, only a salted PBKDF2 hash of it.
   Keep SEED_LOCKED the same in future versions so the recovery code keeps working. */
const AUTH_KEY = 'debitOrders.auth', SEED_STORE = 'debitOrders.seed', SESSION_KEY = 'debitOrders.session';
const PW_ITER = 310000;
const te = new TextEncoder(), td = new TextDecoder();
const toB64 = buf => { let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const cryptoOK = !!(window.crypto && crypto.subtle);
function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function ssSet(k, v){ try { sessionStorage.setItem(k, v); } catch(e){} }
function ssDel(k){ try { sessionStorage.removeItem(k); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

async function pbkdf2(secret, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter}, base, 256);
}
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
async function unlockSeed(code){
  try {
    const L = SEED_LOCKED, bits = await pbkdf2(normCode(code), fromB64(L.salt), L.iter);
    const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: fromB64(L.iv)}, key, fromB64(L.ct));
    return JSON.parse(td.decode(pt));
  } catch(e){ return null; }        // wrong code: the lock won't open
}
async function hashPassword(pw, saltB64){ return toB64(await pbkdf2(pw, fromB64(saltB64), PW_ITER)); }
function getAuth(){
  try { const a = JSON.parse(lsGet(AUTH_KEY) || 'null'); return a && a.user && a.hash && a.salt ? a : null; } catch(e){ return null; }
}
async function setAuth(user, pw){
  const salt = toB64(crypto.getRandomValues(new Uint8Array(16)));
  const a = {user, salt, iter: PW_ITER, hash: await hashPassword(pw, salt)};
  if (!lsSet(AUTH_KEY, JSON.stringify(a))) throw new Error('save');
  return a;
}
async function checkPassword(a, user, pw){
  if (user.trim().toLowerCase() !== a.user.toLowerCase()) { await hashPassword(pw, a.salt); return false; }   // same wait either way
  return (await hashPassword(pw, a.salt)) === a.hash;
}
function rememberSession(stay){ ssSet(SESSION_KEY, '1'); if (stay) lsSet(SESSION_KEY, 'remember'); else lsDel(SESSION_KEY); }
const signedIn = () => !!getAuth() && (lsGet(SESSION_KEY) === 'remember' || ssGet(SESSION_KEY) === '1');
function signOut(){ flush(); lsDel(SESSION_KEY); ssDel(SESSION_KEY); location.reload(); }
const authUser = () => (getAuth() || {}).user || '';

/* ---- the sign-in screen ---- */
const LOCK_MODES = {
  setupCode:     {sub: 'Enter your recovery code to unlock your figures. You only need to do this once on each device.', fields: ['Code'], go: 'Unlock', link: ''},
  setupAccount:  {sub: 'Figures unlocked. Now create the username and password you’ll sign in with.', fields: ['User', 'Pass', 'Pass2', 'Stay'], go: 'Create and open', link: ''},
  login:         {sub: 'Sign in to continue.', fields: ['User', 'Pass', 'Stay'], go: 'Sign in', link: 'Forgot password?'},
  forgotCode:    {sub: 'Enter your recovery code to set a new password.', fields: ['Code'], go: 'Continue', link: 'Back to sign in'},
  forgotAccount: {sub: 'Choose a new password. You can change your username too.', fields: ['User', 'Pass', 'Pass2', 'Stay'], go: 'Save and open', link: 'Back to sign in'},
};
let lockMode = 'login';
function showLock(mode, err){
  lockMode = mode; const M = LOCK_MODES[mode];
  document.body.classList.add('locked'); $('lock').hidden = false;
  $('lockSub').textContent = M.sub;
  ['Code', 'User', 'Pass', 'Pass2', 'Stay'].forEach(f => $('w' + f).hidden = !M.fields.includes(f));
  $('lkPass').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  $('lkPass').value = ''; $('lkPass2').value = ''; $('lkCode').value = '';
  if (mode === 'login' || mode === 'forgotAccount') $('lkUser').value = authUser();
  if (mode === 'setupAccount') $('lkUser').value = '';
  $('lockGo').textContent = M.go; $('lockGo').disabled = false;
  $('lockLink').textContent = M.link; $('lockLink').hidden = !M.link;
  $('lockErr').textContent = err || '';
  const note = $('lockNote');
  note.hidden = !(mode === 'setupAccount' || mode === 'forgotAccount');
  note.textContent = 'If you ever forget your password, your recovery code lets you set a new one.';
  const first = mode.endsWith('Code') ? $('lkCode') : (mode === 'login' && $('lkUser').value ? $('lkPass') : $('lkUser'));
  setTimeout(() => first.focus(), 50);
}
function hideLock(){ $('lock').hidden = true; document.body.classList.remove('locked'); }

$('lockLink').addEventListener('click', () => showLock(lockMode === 'login' ? 'forgotCode' : 'login'));
$('lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const go = $('lockGo'), err = msg => { $('lockErr').textContent = msg; go.disabled = false; go.textContent = LOCK_MODES[lockMode].go; };
  $('lockErr').textContent = '';
  const user = $('lkUser').value.trim(), pw = $('lkPass').value, pw2 = $('lkPass2').value, stay = $('lkStay').checked;
  if (lockMode.endsWith('Code')) {
    if (normCode($('lkCode').value).length < 16) return err('Enter all 16 characters of your recovery code.');
  } else {
    if (!user) return err('Enter a username.');
    if (!pw) return err('Enter your password.');
    if (lockMode !== 'login') {
      if (pw.length < 6) return err('Use at least 6 characters for your password.');
      if (pw !== pw2) return err('The two passwords don’t match.');
    }
  }
  go.disabled = true; go.textContent = 'Checking…';
  try {
    if (lockMode.endsWith('Code')) {
      const seed = await unlockSeed($('lkCode').value);
      if (!seed) return err('That recovery code doesn’t match. Check it and try again.');
      SEED = seed; lsSet(SEED_STORE, JSON.stringify(seed));
      showLock(lockMode === 'setupCode' ? 'setupAccount' : 'forgotAccount');
      return;
    }
    if (lockMode === 'login') {
      const a = getAuth();
      if (!a || !(await checkPassword(a, user, pw))) return err('Username or password is wrong.');
    } else {
      await setAuth(user, pw);
    }
    rememberSession(stay);
    startApp();
  } catch(ex){ console.error(ex); err('Something went wrong saving your sign-in. Try again.'); }
});

/* ---- change password, from the profile ---- */
async function changePassword(){
  const a = getAuth(); if (!a) return;
  const cur0 = $('cpCurrent').value, user = $('cpUser').value.trim(), pw = $('cpNew').value, pw2 = $('cpNew2').value;
  const err = msg => { $('cpErr').textContent = msg; $('cpSave').disabled = false; };
  $('cpErr').textContent = '';
  if (!user) return err('Enter a username.');
  if (pw.length < 6) return err('Use at least 6 characters for the new password.');
  if (pw !== pw2) return err('The two new passwords don’t match.');
  $('cpSave').disabled = true;
  if (!(await checkPassword(a, a.user, cur0))) return err('Your current password is wrong.');
  await setAuth(user, pw);
  $('cpSave').disabled = false; $('pwDlg').close(); renderProfile(); toast('Sign-in details changed');
}

$('changePwBtn').addEventListener('click', () => {
  commitProfile(); $('profileDlg').close();
  ['cpCurrent', 'cpNew', 'cpNew2'].forEach(i => $(i).value = ''); $('cpUser').value = authUser(); $('cpErr').textContent = '';
  $('pwDlg').showModal(); $('cpCurrent').focus();
});
$('cpCancel').addEventListener('click', () => $('pwDlg').close());
$('pwForm').addEventListener('submit', e => { e.preventDefault(); changePassword(); });
$('signOutBtn').addEventListener('click', fromProfile(signOut));

/* ================= Start ================= */
$('verLabel').textContent = APP_VERSION;
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}
$('lockLogo').src = document.querySelector('link[rel="icon"][type="image/svg+xml"]').href;
chart.start();
function startApp(){
  if (!SEED) { try { SEED = JSON.parse(lsGet(SEED_STORE) || 'null'); } catch(e){} }
  state = load();
  hideLock(); renderAll(); window.scrollTo({top: 0});
  if (!lsGet(STORE_KEY)) save(true); else setSaveState('ok');
  if (loadProblem) toast('Your saved data couldn’t be read, so a copy was kept and the app restarted from your spreadsheet figures. Restore your latest backup from the profile.');
}
if (!cryptoOK) showLock('login', 'This browser can’t run the secure sign-in. Open the app from its https:// address in Safari or Chrome.');
else if (signedIn()) startApp();
else showLock(getAuth() ? 'login' : 'setupCode');

})();
</script>
